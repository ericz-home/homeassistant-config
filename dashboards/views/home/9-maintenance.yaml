- type: grid
  column_span: 1
  cards:
    - type: vertical-stack
      cards:
        - type: custom:bubble-card
          card_type: separator
          name: 'Maintenance'
          icon: mdi:tools
          sub_button:
            - icon: mdi:arrow-expand
              show_background: false
              tap_action:
                action: navigate
                navigation_path: '#maintenance'
              double_tap_action:
                action: navigate
                navigation_path: 'maintenance'
        - type: custom:auto-entities
          card: 
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - integration: mqtt
                attributes:
                  device_class: 'battery'
                  state_class: 'measurement'
                state: '< 30'
                options:
                  type: tile
          sort:
            method: state
            numeric: true
        - type: custom:auto-entities
          card: 
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - entity_id: input_datetime.erics_meds_last
                state: "> 20h ago" 
                options:
                  type: custom:mushroom-entity-card
                  icon_color: 'var(--rgb-warning)'
        - type: custom:auto-entities
          card: 
            type: grid
            columns: 1
            square: false
          card_param: cards
          filter:
            include:
              - entity_id: input_datetime.ev6_last_full_charge
                state: "> 25d ago" 
                options:
                  type: custom:mushroom-entity-card
                  icon_color: 'var(--rgb-warning)'
        - type: custom:bubble-card
          card_type: pop-up
          hash: '#maintenance'
          cards:
            - type: custom:bubble-card
              card_type: separator
              name: 'Meds'
              icon: mdi:pill
            - type: custom:mushroom-entity-card
              entity: input_datetime.erics_meds_last
              card_mod:
                style: |
                  ha-state-icon {
                    {% set age = now() - as_local(as_datetime(config.entity)) %}
                    {% if age > timedelta(hours=20) %}
                      color: var(--warning-color);
                    {% elif age >= timedelta(hours=24) %}
                      color: var(--alert-color);
                    {% else %}
                      color: var(--info-color);
                    {% endif %};
                  }
            - type: custom:bubble-card
              card_type: separator
              name: 'Car'
              icon: mdi:car-electric
            - type: custom:mushroom-entity-card
              entity: input_datetime.ev6_last_full_charge
              card_mod:
                style: |
                  ha-state-icon {
                    {% set age = now() - as_local(as_datetime(config.entity)) %}
                    {% if age > timedelta(days=25) %}
                      color: var(--warning-color);
                    {% elif age >= timedelta(days=31) %}
                      color: var(--alert-color);
                    {% else %}
                      color: var(--info-color);
                    {% endif %};
                  }
     
     
