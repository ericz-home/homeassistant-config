path: commute
title: Commute
icon: mdi:train-car
cards:
  - type: vertical-stack
    cards:
      - type: entities
        title: Commute Time
        entities:
          - type: 'custom:multiple-entity-row'
            name: "Splunk"
            secondary_info: last-updated
            entity: sensor.waze_travel_time_splunk
            attribute: route
            entities:
              - attribute: duration
                unit: min
              - attribute: distance
                unit: mi
          - type: section
          - type: 'custom:multiple-entity-row'
            name: "Seabird"
            secondary_info: last-updated
            entity: sensor.waze_travel_time_seabird
            attribute: route
            entities:
              - attribute: duration
                unit: min
              - attribute: distance
                unit: mi
      - type: iframe
        url: https://embed.waze.com/iframe?zoom=12&lat=47.652900&lon=-122.331026&pin=1&desc=1
        aspect_ratio: 100%
